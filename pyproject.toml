[project]
name = "reelfactory"
version = "0.1.0"
description = "Autonomous viral short-form video factory powered by Claude: ideation, hooks, scripts, AI image/video prompts, packaging, A/B variants and QC."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.9.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pillow>=10",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reelfactory = "reelfactory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reelfactory", "reelfactory.media", "reelfactory.publish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
